<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - Tienda de Computadoras</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Tienda de Computadoras</h1>
  </header>
  
  <nav>
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="productos.html">Productos</a></li>
      <li><a href="clientes.html">Clientes</a></li>
      <li><a href="proveedores.html">Proveedores</a></li>
      <li><a href="ventas.html">Ventas</a></li>
    </ul>
  </nav>
  
  <main>
    <h2>Gestión de Productos</h2>
    
    <form id="productoForm">
      <input type="hidden" id="productoId">
      <input type="text" id="codigo" placeholder="Código" required>
      <input type="text" id="nombre" placeholder="Nombre" required>
      <input type="text" id="marca" placeholder="Marca" required>
      <input type="text" id="categoria" placeholder="Categoría" required>
      <input type="text" id="procesador" placeholder="Procesador">
      <input type="text" id="ram" placeholder="RAM">
      <input type="text" id="almacenamiento" placeholder="Almacenamiento">
      <input type="text" id="tarjetaGrafica" placeholder="Tarjeta Gráfica">
      <input type="number" id="precio" placeholder="Precio" required>
      <input type="number" id="stock" placeholder="Stock" required>
      <textarea id="descripcion" placeholder="Descripción"></textarea>
      <select id="estado">
        <option value="ACTIVO">ACTIVO</option>
        <option value="INACTIVO">INACTIVO</option>
      </select>
      <select id="proveedorId">
        <option value="">Seleccionar Proveedor</option>
      </select>
      <button type="submit">Guardar</button>
      <button type="button" onclick="limpiarFormulario()">Cancelar</button>
    </form>
    
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Marca</th>
          <th>Categoría</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="productosTable"></tbody>
    </table>
  </main>
  
  <footer>
    <p>&copy; 2026 Tienda de Computadoras</p>
  </footer>
  
  <script src="js/productos.js"></script>
</body>
</html>
